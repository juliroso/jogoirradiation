<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mito ou Verdade - Proteção Radiológica</title>
    <style>
        :root {
            --bg-color: #0b0b3b; /* Azul escuro/roxo da identidade */
            --text-color: #ffffff;
            --accent-color: #f39c12; /* Laranja */
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* CONFIGURAÇÃO DA IMAGEM DE FUNDO */
            background-image: url('Cópia de Apresentação Tutoria 2026.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            /* Fundo escuro (roxo/azul) da identidade, com leve transparência */
            background: rgba(11, 11, 59, 0.95); 
            color: var(--text-color);
            backdrop-filter: blur(8px); 
            
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2em;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9em;
            margin-bottom: 20px;
            color: #ccc;
        }

        /* ESTILOS DA BARRA DE PROGRESSO */
        .progress-container {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-bottom: 30px;
            height: 12px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-box {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 30px;
            min-height: 80px;
        }

        .btn {
            background-color: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 20px;
            font-size: 1.1em;
            min-height: 100px;
            display: none;
